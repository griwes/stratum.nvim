name: ci

on:
    push:
        branches:
            - main
    pull_request:

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Stylua
              run: cargo install stylua --version 2.5.2 --locked
            - name: Run lint checks
              run: scripts/ci/lint.sh
            - name: Validate workflow syntax
              run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

    test:
        name: test (${{ matrix.neovim }})
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                neovim: ['v0.11.5', 'stable', 'nightly']
        env:
            GITSEER_BIN: ${{ github.workspace }}/.dependencies/gitseer/target/debug/gitseer
            STRATUM_REQUIRE_GITSEER_INTEGRATION: '1'
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: griwes/gitseer
                  ref: main
                  path: .dependencies/gitseer
            - name: Install stable Rust
              run: rustup update stable --no-self-update
            - name: Build Gitseer
              working-directory: .dependencies/gitseer
              run: scripts/ci/build.sh
            - name: Install Neovim
              run: scripts/ci/install-neovim.sh '${{ matrix.neovim }}'
            - name: Run tests
              run: scripts/ci/test.sh
            - name: Run clean-install smoke
              run: scripts/ci/install-smoke.sh

    install-gitseer-from-cargo:
        name: install Gitseer (Cargo)
        runs-on: ubuntu-26.04
        timeout-minutes: 30
        env:
            GITSEER_CARGO_PATH: ${{ github.workspace }}/.dependencies/gitseer
            RUSTUP_TOOLCHAIN: 1.98.0
            STRATUM_GITSEER_INSTALL_SOURCE: cargo
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  repository: griwes/gitseer
                  ref: main
                  path: .dependencies/gitseer
            - name: Install minimum Rust toolchain
              run: rustup toolchain install 1.98.0 --profile minimal
            - name: Install Neovim
              run: scripts/ci/install-neovim.sh stable
            - name: Install Gitseer through Stratum
              run: scripts/ci/install-gitseer-smoke.sh

    install-gitseer-from-github:
        name: install Gitseer (GitHub nightly)
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        env:
            STRATUM_GITSEER_INSTALL_SOURCE: github
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Install Neovim
              run: scripts/ci/install-neovim.sh stable
            - name: Install Gitseer through Stratum
              run: scripts/ci/install-gitseer-smoke.sh
