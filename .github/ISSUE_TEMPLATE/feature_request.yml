name: Feature request
description: Propose a focused change to Stratum.
title: "feature: "
labels:
    - enhancement
body:
    - type: textarea
      id: problem
      attributes:
          label: Problem
          description: Describe the concrete workflow or limitation this request addresses.
      validations:
          required: true
    - type: textarea
      id: proposal
      attributes:
          label: Proposed behavior
          description: Describe the desired behavior and public interface.
      validations:
          required: true
    - type: textarea
      id: alternatives
      attributes:
          label: Alternatives considered
          description: Explain existing workarounds or smaller alternatives.
    - type: textarea
      id: compatibility
      attributes:
          label: Compatibility and integration impact
          description: Note affected platforms, dependencies, or related plugins.

